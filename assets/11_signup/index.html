<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>FixTrack — Sign Up</title><link rel="stylesheet" href="../01_issue_board/style.css"><link rel="stylesheet" href="auth.css"></head>
<body><input id="dark-mode" class="theme-toggle" type="checkbox"><div class="auth-shell"><div class="auth-brand"><a href="../index.html">FIXTRACK</a><small>CIVIL OPERATIONS</small></div><main class="auth-card signup-card"><div class="auth-kicker">GET STARTED</div><h1>Create your FixTrack account</h1><p class="subtitle">Sign up first, then report and track facility issues from your dashboard.</p><form class="auth-form" action="../index.html" method="get"><div class="auth-grid"><label>Full name<input type="text" name="name" placeholder="Your full name" required></label><label>Phone number<input type="tel" name="phone" placeholder="+91 XXXXX XXXXX" required></label></div><label>Email address<input type="email" name="email" placeholder="you@example.com" required></label><div class="auth-grid"><label>Password<input type="password" name="password" minlength="6" placeholder="At least 6 characters" required></label><label>Confirm password<input type="password" name="confirm_password" minlength="6" placeholder="Repeat password" required></label></div><label>Account type<select name="role"><option>Student / Resident</option><option>Facilities Manager</option><option>Technician</option><option>Administrator</option></select></label><label class="check"><input type="checkbox" required> I agree to the FixTrack terms and reporting guidelines.</label><button class="btn btn-primary" type="submit">Create Account</button></form><p class="auth-switch">Already have an account? <a href="../10_login/index.html">Login</a></p><a class="back-home" href="../index.html">← Back to Dashboard</a></main><div class="auth-theme"><label for="dark-mode">☾ Theme</label></div></div></body></html>
